[project]
name = "xlsx-report-parser"
version = "0.1.0"
description = "Parse 'wide' XLSX device reports (one column per day) into clean daily records, with unit conversion, validation and export."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["openpyxl>=3.1"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.8"]

[project.scripts]
xlsx-report = "xlsx_report_parser.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xlsx_report_parser"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
